services:

  app:
    image: localhost:8088/library/psw-nginx:${TAG}
    container_name: psw-app
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: psw-proxy

    ports:
      - "8085:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    restart: unless-stopped
